services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=strategy_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=strategy_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    container_name: postgres
    ports:
      - "5432:5432"

volumes:
  postgres-data: