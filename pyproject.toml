[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "strat"
authors = [
    {name = "Tom McLean"},
]
description = "A trading strategy framework"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dynamic = ["readme"]
requires-python = ">=3.13"
version = "0.0.1dev0"

dependencies = [
    "sqlalchemy[asyncio]",
    "arrow",
    "pydash",
    "alembic",
    "psycopg2",
    "loguru",
    "tqdm",
    "pandas",
    "ta-lib-easy",
    "numpy",
    "uvicorn",
    "pydantic",
    "asyncpg",
    "python-multipart",
    "fastapi>=0.117.1",
    "click>=8.1.8",
    "quantstats>=0.0.77",
    "ipython>=9.5.0",
    "aiohttp>=3.12.15",
]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools]
packages = ["strategy"]

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.nox
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | configs
    | examples
)/
'''

[tool.ruff.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]

[tool.ruff.isort]
split-on-trailing-comma = true
known-third-party = []
known-first-party = ["strategy"]
no-lines-before = ["local-folder"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "this",
    "local-folder"
]

[tool.ruff.isort.sections]
"this" = ["strategy"]

[tool.pytest.ini_options]
addopts = "--cov=strategy --cov-report=term-missing:skip-covered --cov-report=html"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["strategy"]
omit = [
  "alembic/*",
  "strategy/app/*",
  "strategy/db/backtest.py",
  "strategy/modes/import_candles_mode/*",
  "strategy/indicators/*",
  "strategy/strategies/*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.ruff]
fix = true
preview = false
line-length = 90
lint.select = ["ALL"]
lint.ignore = [
    "D102",    # https://docs.astral.sh/ruff/rules/undocumented-public-method/
    "D103",
    "D107",    # https://docs.astral.sh/ruff/rules/undocumented-public-init/
    "S314",    # https://docs.astral.sh/ruff/rules/suspicious-xml-element-tree-usage/
    "TRY003",  # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
    "INP001",  # https://docs.astral.sh/ruff/rules/implicit-namespace-package/
    "EM",      # https://docs.astral.sh/ruff/rules/#flake8-errmsg-em
    "ANN",     # https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
    "BLE",     # https://docs.astral.sh/ruff/rules/blind-except/
    "D107",    # https://docs.astral.sh/ruff/rules/undocumented-public-init/
    "TRY003",  # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
    "N999",    # https://docs.astral.sh/ruff/rules/invalid-module-name/
    "CPY001",  # https://docs.astral.sh/ruff/rules/missing-copyright-notice/
    "DOC201",  # https://docs.astral.sh/ruff/rules/docstring-missing-returns/
    "DOC402",  # https://docs.astral.sh/ruff/rules/docstring-missing-yields/
    "DOC501",  # https://docs.astral.sh/ruff/rules/docstring-missing-exception/
    "TD002",   # https://docs.astral.sh/ruff/rules/missing-todo-author/
    "TD003",   # https://docs.astral.sh/ruff/rules/missing-todo-link/
    "FIX002",  # https://docs.astral.sh/ruff/rules/line-contains-todo/
    "RUF052",  # https://docs.astral.sh/ruff/rules/used-dummy-variable/
    "TID252",  # https://docs.astral.sh/ruff/rules/relative-imports/
    "D100",    # https://docs.astral.sh/ruff/rules/undocumented-public-module/
    "D105",    # https://docs.astral.sh/ruff/rules/undocumented-magic-method/
    "PLR0904",
    "D101",
]
exclude = ["alembic/*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/**/*.py" = [
    "S101",    # https://docs.astral.sh/ruff/rules/assert
    "S311",    # https://docs.astral.sh/ruff/rules/suspicious-non-cryptographic-random-usage/
    "FBT",     # https://docs.astral.sh/ruff/rules/#flake8-boolean-trap-fbt
    "PLC2701", # https://docs.astral.sh/ruff/rules/import-private-name/
    "PLR2004", # https://docs.astral.sh/ruff/rules/magic-value-comparison/
    "SLF001",  # https://docs.astral.sh/ruff/rules/private-member-access/
    "RUF029",  # https://docs.astral.sh/ruff/rules/unused-async/
    "TC001",   # https://docs.astral.sh/ruff/rules/typing-only-first-party-import/
    "TC002",   # https://docs.astral.sh/ruff/rules/typing-only-third-party-import/
    "TC003",   # https://docs.astral.sh/ruff/rules/typing-only-standard-library-import/
    "PLC0415", # https://docs.astral.sh/ruff/rules/import-outside-top-level/

    "PT011",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 115

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 15

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [

]
quote-annotations = true # https://docs.astral.sh/ruff/settings/#lint_flake8-type-checking_quote-annotations

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100

[tool.mypy]
plugins = ["pydantic.mypy"]

check_untyped_defs = true

disallow_any_generics = true
disallow_any_unimported = false
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true

explicit_package_bases = true

ignore_missing_imports = false

no_implicit_optional = true
no_implicit_reexport = true

show_column_numbers = true
show_error_codes = true
show_error_context = true

strict = true
strict_equality = true
strict_optional = true

warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true

enable_error_code = [
    "arg-type",           # Checks for argument types in function calls.
    "assignment",         # Validates types of variable assignments.
    "return-value",       # Ensures that return values match the declared type.
    "call-overload",      # Validates correct use of method/function overloads.
    "operator",           # Checks operator usage against expected types.
    "index",              # Validates types used in indexing operations.
    "attr-defined",       # Checks if attributes exist in classes/objects.
    "no-untyped-call",    # Prevents calls to untyped functions in typed contexts.
    "unreachable",        # Warns about code that can never be executed.
    "truthy-bool",        # Ensures that boolean expressions are boolean in type.
    "union-attr",         # Checks for attribute access in unions safely.
    "dict-item",          # Checks for proper types used in dictionary items.
    "unused-awaitable",   # Warns if an awaitable is not awaited.
    "override",           # Ensures overridden methods match the signature in base class.
    "list-item",          # Checks type consistency of list items.
    "return",             # Ensures all code paths in a function return a value if needed.
    "type-var",           # Ensures type variables are used correctly.
    "valid-type",         # Validates types used in annotations are recognized.
    "func-returns-value", # Ensures functions declared with a return type actually return a value.
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pydantic[mypy]>=2.11.9",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]
